<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="weather.css">
  <script src="navbar.js" defer></script>
  <link rel="icon" type="image/png" href="photos/favicon.png">

  <meta name="google-site-verification" content="ti0K1GmdA-eVPw1O3JYrnHdjSoNVHqTH-rC1WJzGFtI" />

</head>

<body>
  <div class="loader-wrapper" id="loader">
    <div class="loader"></div>
  </div>

  <div id="navbar"></div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      loader.classList.add('fade-out');
    });
  </script>

  <section id="home" class="hero">
    <h4><span class="wave">👋</span> <span id="greeting-text">Welcome to my portfolio</span></h4>
    <div class="name">
      <h1>Hi, I'm <span class="name">Karthikesh</span></h1>
    </div>
    <p>

      I design and build intelligent systems using AI and modern web technologies.
      Passionate about problem solving, learning, and clean development.
    </p>

    <div class="hero-buttons">
      <a href="projects.html" class="btn primary">View Projects →</a>
      <a href="contact.html" class="btn secondary">Contact Me</a>
    </div>

    <div class="findme">
      <h3>Find me on: </h3>
      <div class="github">
        <img src="photos/github.svg" alt="github" onclick="window.open('https://github.com/Karthiii26', '_blank')">
      </div>
      <div class="linkedin">
        <img src="photos/linkedin.svg" alt="linkedin"
          onclick="window.open('https://www.linkedin.com/in/karthikesh26/', '_blank')">
      </div>
      <div class="mail">
        <img src="photos/mail.svg" alt="mail" onclick="window.open('mailto:karthikeshram@gmail.com', '_blank')">
      </div>
    </div>

  </section>
  
  <footer>
    <p>&copy; 2026 Karthikesh. All rights reserved.</p>
  </footer>

  <script>
    function setDynamicGreeting() {
      const hour = new Date().getHours();
      const greetingElement = document.getElementById('greeting-text');
      
      if (!greetingElement) return;

      if (hour >= 5 && hour < 12) {
        greetingElement.innerText = "Good morning! ☕";
      } else if (hour >= 12 && hour < 17) {
        greetingElement.innerText = "Good afternoon! ☀️";
      } else if (hour >= 17 && hour < 22) {
        greetingElement.innerText = "Good evening!";
      } else {
        greetingElement.innerText = "Late night coding? 🦉";
      }

      greetingElement.style.transition = "opacity 0.6s ease";
      
      setTimeout(() => {
        greetingElement.style.opacity = "0"; 
        
        setTimeout(() => {
          greetingElement.innerText = "Welcome to my portfolio"; 
          greetingElement.style.opacity = "1"; 
        }, 600); 
        
      }, 2500);
    }
    
    setDynamicGreeting();
  </script>
</body>


</html>
